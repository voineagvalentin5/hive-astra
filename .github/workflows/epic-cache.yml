# Refresh the same-origin copy of the latest NASA EPIC day so the globe projection works on static hosting.
name: Refresh EPIC cache
on:
  schedule:
    - cron: "40 */6 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==11.0.0
      - run: python3 tools/bake_epic.py
      - name: Commit if changed
        run: |
          git config user.name "hive-astra-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/epic
          git diff --cached --quiet || (git commit -m "EPIC cache: $(date -u +%F)" && git push)
